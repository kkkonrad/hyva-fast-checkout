<!--
/**
 * Fastcheckout cart items list — matches previous SSR summary product rows.
 * Badge in the card header already shows qty; skip Magento "Items in Cart" title.
 */
-->
<div class="block items-in-cart fastcheckout-summary-items"
     data-bind="mageInit: {'collapsible':{'openedState': 'active', 'active': true}}">
    <div class="content minicart-items" data-role="content">
        <div class="minicart-items-wrapper">
            <ol class="minicart-items">
                <each args="items()">
                    <li class="product-item">
                        <div class="product">
                            <each args="$parent.elems()" render=""></each>
                        </div>
                    </li>
                </each>
            </ol>
        </div>
    </div>
</div>
