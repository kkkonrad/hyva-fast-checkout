<!--
/**
 * Magento-style order comment field (Fastcheckout; not present in core OPC).
 * Label / placeholder are PHP-translated via the component (see order-comment.js).
 */
-->
<div class="fastcheckout-native-comment field">
    <label class="label" for="fastcheckout-comment">
        <span data-bind="text: label"></span>
    </label>
    <div class="control">
        <textarea id="fastcheckout-comment"
                  name="fastcheckout_comment"
                  class="input-text form-input"
                  rows="2"
                  data-fastcheckout-comment
                  data-bind="value: comment,
                             valueUpdate: 'input',
                             attr: { placeholder: placeholder }"></textarea>
    </div>
</div>
