<!--
/**
 * Magento_SalesRule payment discount (coupon) — Fastcheckout card layout.
 * Uses the same apply/cancel actions as Magento OPC; no collapsible chrome.
 */
-->
<div class="card relative fastcheckout-native-discount payment-option opc-payment-additional discount-code"
     data-bind="attr: { 'data-coupon-applied': isApplied() ? '1' : '0' }">
    <h2 class="fastcheckout-native-discount-title" id="block-discount-heading" role="heading" aria-level="2">
        <!-- ko i18n: 'Apply Discount Code' --><!-- /ko -->
    </h2>

    <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
    <!-- /ko -->

    <form class="form form-discount" id="discount-form"
          data-bind="submit: function () { return false; }">
        <!--
          Input + button share one row. Validation errors (.mage-error) must not
          stretch the Apply button — they sit under the input column only.
        -->
        <div class="fastcheckout-native-discount-row">
            <div class="field">
                <label class="label" for="discount-code">
                    <span data-bind="i18n: 'Enter discount code'"></span>
                </label>
                <div class="control">
                    <input class="input-text form-input"
                           type="text"
                           id="discount-code"
                           name="discount_code"
                           data-validate="{'required-entry':true}"
                           data-bind="value: couponCode,
                                      attr: {
                                          disabled: isApplied(),
                                          placeholder: $t('Enter discount code')
                                      }"/>
                </div>
            </div>
            <div class="actions-toolbar">
                <!-- ko ifnot: isApplied() -->
                <button class="action action-apply btn btn-primary"
                        type="button"
                        data-bind="click: apply, attr: { value: $t('Apply Discount') }">
                    <span data-bind="i18n: 'Apply'"></span>
                </button>
                <!-- /ko -->
                <!-- ko if: isApplied() -->
                <button class="action action-cancel btn btn-secondary"
                        type="button"
                        data-bind="click: cancel, attr: { value: $t('Cancel') }">
                    <span data-bind="i18n: 'Cancel'"></span>
                </button>
                <!-- /ko -->
            </div>
        </div>

        <!-- ko foreach: getRegion('captcha') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
        <!-- /ko -->
    </form>
</div>
